<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <!-- ── Emblem Section (Left) ─────────────────────────────────────────── -->
  <g transform="translate(60, 60)">
    <!-- Outer Neutral Gray Arc -->
    <path d="M -46 4 C -48 -6 -32 -20 -8 -26 C 14 -32 40 -26 48 -14" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" opacity="0.9" transform="rotate(-15)" />
    
    <!-- Outer MEHAR Green Orbit Arc -->
    <path d="M -30 22 C 2 30 38 24 50 10 C 60 -2 52 -18 30 -24" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" transform="rotate(-15)" />
    
    <!-- Inner Energy Green Orbit Arc -->
    <path d="M -44 10 C -48 0 -36 -14 -12 -20 C 16 -26 40 -20 46 -8 C 50 2 38 16 10 22 C -18 28 -40 20 -44 10 Z" fill="none" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" transform="rotate(-15)" />

    <!-- Central Dynamic Lightning Bolt -->
    <polygon points="-2,-38 12,-38 -6,0 10,0 -12,38 0,4 -10,4" fill="#059669" />

    <!-- Spark Star on Upper Right Arc -->
    <g transform="translate(42, -22)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#059669" />
    </g>
  </g>

  <!-- ── Typography Section (Right) ────────────────────────────────────── -->
  <!-- Wordmark MEHAR with Green 'H' (Zero whitespace between tspans for seamless connected wordmark) -->
  <g transform="translate(130, 68)">
    <text font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="0.5"><tspan fill="#0F172A">ME</tspan><tspan fill="#059669">H</tspan><tspan fill="#0F172A">AR</tspan></text>
  </g>

  <!-- Tagline: THE NAME YOU TRUST (Preserved wide tracking) -->
  <g transform="translate(132, 94)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569" letter-spacing="3.8">THE NAME YOU TRUST</text>
  </g>
</svg>
