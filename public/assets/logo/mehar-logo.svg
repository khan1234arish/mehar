<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="meharCorporateGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="meharCorporateBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Industrial Clean Energy Shield Emblem -->
  <g transform="translate(10, 10)">
    <!-- Battery Cell Outer Casing -->
    <path d="M 45 5 L 75 22 L 75 68 L 45 85 L 15 68 L 15 22 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M 45 10 L 70 24 L 70 65 L 45 80 L 20 65 L 20 24 Z" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    
    <!-- Dynamic Power Lightning Core -->
    <path d="M 48 18 L 30 46 L 44 46 L 38 72 L 62 40 L 48 40 Z" fill="url(#meharCorporateGreen)"/>
    
    <!-- Battery Terminal Nodes -->
    <rect x="38" y="2" width="14" height="4" rx="2" fill="#0284C7"/>
    <circle cx="30" cy="55" r="2.5" fill="#059669"/>
    <circle cx="60" cy="55" r="2.5" fill="#0284C7"/>
  </g>

  <!-- Brand Typography (Clean High Contrast on White) -->
  <text x="110" y="60" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="46" letter-spacing="3" fill="#0F172A">
    MEHAR
  </text>

  <!-- Accent Energy Dot -->
  <circle cx="282" cy="38" r="5" fill="url(#meharCorporateGreen)"/>

  <!-- Parent Company Descriptor -->
  <text x="112" y="82" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#059669">
    LAWAD INFRASTRUCTURE
  </text>
  
  <text x="306" y="82" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="1.5" fill="#64748B">
    PVT. LTD.
  </text>

  <!-- Clean Corporate Divider Line -->
  <line x1="112" y1="92" x2="430" y2="92" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="112" y1="92" x2="220" y2="92" stroke="#10B981" stroke-width="1.5"/>
</svg>
